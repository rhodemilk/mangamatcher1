services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mangamatcher_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mangamatcher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - mangamatcher_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mangamatcher"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management (development only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mangamatcher_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mangamatcher.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mangamatcher_network
    profiles:
      - dev  # Only run with --profile dev

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  mangamatcher_network:
    driver: bridge
